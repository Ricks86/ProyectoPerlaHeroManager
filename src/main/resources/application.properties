# ==============================================================================
# CONFIGURACIÓN DE CONEXIÓN A ORACLE AUTONOMOUS DATABASE (mTLS CON WALLET)
# ==============================================================================
# Puerto del Servidor Spring Boot
server.port=8080

# 1. URL de Conexión JDBC a Oracle ADB con parámetro TNS_ADMIN
# Reemplaza 'proyectoroldb_high' con el nombre de tu servicio en tnsnames.ora (ej: proyectorol_high, proyectorol_medium, proyectorol_low)
# Reemplaza '/ruta/a/tu/wallet_descomprimida' con la ruta absoluta donde descomprimiste el archivo Wallet_*.zip (ej: /home/usuario/oracle_wallet)
spring.datasource.url=jdbc:oracle:thin:@COSTADELAPERLA_HIGH?TNS_ADMIN=/home/duckyrichii/Escritorio/codigos/Wallet_CostadelaPerla

# 2. Credenciales de la Base de Datos Oracle Autonomous DB
spring.datasource.username=ElPerla
spring.datasource.password=ContraPerlisima#86

# 3. Driver JDBC de Oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 4. Dialecto de Hibernate para Oracle Database
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# 5. Estrategia DDL de Hibernate (update crea o actualiza automáticamente las tablas)
spring.jpa.hibernate.ddl-auto=update

# 6. Mostrar consultas SQL formateadas en consola (útil para depuración)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


